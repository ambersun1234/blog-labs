version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: keycloak-lab
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json
